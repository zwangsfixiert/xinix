# /etc/nginx/sites-available/deeptrades.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name deeptrades.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name deeptrades.example.com;

    ssl_certificate     /etc/letsencrypt/live/deeptrades.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deeptrades.example.com/privkey.pem;

    auth_basic           "Deep Trades";
    auth_basic_user_file /etc/nginx/.htpasswd-deeptrades;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /stream {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
}
